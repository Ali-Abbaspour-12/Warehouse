<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سیستم مدیریت انبار - سبک نئومورفیک</title>
  <style>
    :root {
      --background: #ecf0f3;
      --shadow-light: #ffffff;
      --shadow-dark: #b8c6cf;
      --accent: #3a7bd5;
      --text: #2c3e50;
      --radius: 16px;
      --padding: 14px;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
    }

    header {
      background: var(--background);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      border-radius: 0 0 var(--radius) var(--radius);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    .tabs {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
      margin: 1rem 2rem;
    }

    .tab {
      background: var(--background);
      padding: 0.6rem 1rem;
      border-radius: var(--radius);
      box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
      cursor: pointer;
      transition: 0.2s;
    }

    .tab:hover {
      transform: translateY(-2px);
      color: var(--accent);
    }

    .tab.active {
      background: var(--accent);
      color: white;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.1), inset -3px -3px 6px rgba(255,255,255,0.3);
    }

    main {
      display: flex;
      padding: 1.5rem 2rem;
      gap: 1.5rem;
    }

    nav.sidebar {
      width: 240px;
      background: var(--background);
      border-radius: var(--radius);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
      padding: 1rem;
    }

    nav.sidebar ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    nav.sidebar li {
      padding: 0.8rem;
      border-radius: var(--radius);
      margin-bottom: 0.6rem;
      box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
      cursor: pointer;
      transition: 0.2s;
    }

    nav.sidebar li:hover {
      background: var(--accent);
      color: white;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,0.1), inset -3px -3px 6px rgba(255,255,255,0.3);
    }

    section.content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card {
      background: var(--background);
      border-radius: var(--radius);
      padding: var(--padding);
      box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }

    .kpi {
      background: var(--background);
      padding: 1rem;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
    }

    .kpi .value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, select, textarea, button {
      padding: 0.7rem;
      border: none;
      border-radius: var(--radius);
      background: var(--background);
      box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
      font-family: inherit;
      color: var(--text);
    }

    button {
      background: var(--accent);
      color: white;
      font-weight: bold;
      box-shadow: 3px 3px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    footer {
      text-align: center;
      color: var(--text);
      opacity: 0.7;
      margin: 2rem 0;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">انبار نئومورفیک</div>
    <input type="search" placeholder="جستجو..." style="padding:0.6rem 1rem;border-radius:var(--radius);border:none;box-shadow:inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);">
  </header>

  <div class="tabs">
    <div class="tab active">داشبورد</div>
    <div class="tab">محصولات</div>
    <div class="tab">سفارش‌ها</div>
    <div class="tab">تامین‌کنندگان</div>
    <div class="tab">تنظیمات</div>
  </div>

  <main>
    <nav class="sidebar">
      <ul>
        <li>دسته‌بندی‌ها</li>
        <li>انبار مرکزی</li>
        <li>انبار تهران</li>
        <li>انبار اصفهان</li>
      </ul>
    </nav>

    <section class="content">
      <div class="card">
        <h3>شاخص‌های کلیدی</h3>
        <div class="kpi-grid">
          <div class="kpi"><div class="label">کالاها</div><div class="value">1,240</div></div>
          <div class="kpi"><div class="label">تامین‌کنندگان</div><div class="value">32</div></div>
          <div class="kpi"><div class="label">سفارش‌ها</div><div class="value">214</div></div>
        </div>
      </div>

      <div class="card">
        <h3>افزودن آیتم جدید</h3>
        <form>
          <input type="text" placeholder="نام کالا">
          <input type="number" placeholder="تعداد">
          <input type="text" placeholder="قیمت">
          <button>ذخیره</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    © 2025 سیستم مدیریت انبار | طراحی بر پایه نئومورفیسم
  </footer>
</body>
</html>
