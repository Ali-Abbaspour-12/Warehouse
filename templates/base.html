<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My IT</title>
    <link rel="icon" href="{{url_for('static',filename='icons/favicon-96x96.png')}}" type="image/png">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rtl.css') }}">
    <link rel="manifest" href="{{url_for('static',filename='js/app.webmanifest')}}">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e3f2fd;
        }

        /* نوار بالا */
        #topbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 60px;
            background-color: #0d6efd;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 10px;
            z-index: 1050;

            overflow-x: auto;
            /* ← اسکرول افقی */
            overflow-y: hidden;
            white-space: nowrap;
            /* ← جلوگیری از رفتن آیتم‌ها به خط بعد */
            scrollbar-width: thin;
            /* Firefox scrollbar */
        }

        /* اسکرول‌بار برای کروم */
        #topbar::-webkit-scrollbar {
            height: 6px;
        }

        #topbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        #topbar ul {
            list-style: none;
            display: inline-flex;
            /* ← مهم برای جلوگیری از شکستن */
            margin: 0;
            padding: 0;
            align-items: center;
            gap: 10px;
            /* فاصله بین آیتم‌ها */
        }

        #topbar ul li {
            display: inline-flex;
        }

        #topbar ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            transition: background 0.2s;
            font-size: 15px;
            white-space: nowrap;
            /* ← جلوگیری از شکستن متن */
        }

        #topbar ul li a.active,
        #topbar ul li a:hover {
            background-color: rgba(255, 255, 255, 0.18);
        }

        .icon {
            margin-left: 6px;
            font-size: 1.2rem;
        }

        /* محتوا بعد از نوار بالا */
        main {
            padding: 80px 20px;
        }
    </style>

</head>

<body>

    <!-- نوار بالا -->
    <div id="topbar" role="navigation" aria-label="main-navbar">
        <ul class="d-flex align-items-center">

            <li>
                <a href="{{ url_for('dashboard_bp.dashboard') }}" data-path="{{ url_for('dashboard_bp.dashboard') }}">
                    <span class="icon">🏠</span> داشبورد
                </a>
            </li>

            <li>
                <a href="{{ url_for('item_bp.item') }}" data-path="{{ url_for('item_bp.item') }}">
                    <span class="icon">📦</span> اموال
                </a>
            </li>

            <li>
                <a href="{{ url_for('personnel_bp.personnel') }}" data-path="{{ url_for('personnel_bp.personnel') }}">
                    <span class="icon">🧑‍💼</span> پرسنل
                </a>
            </li>

            <li>
                <a href="{{ url_for('phone_bp.phone') }}" data-path="{{ url_for('phone_bp.phone') }}">
                    <span class="icon">☎️</span> شماره تلفن
                </a>
            </li>

            <li>
                <a href="{{ url_for('camera_bp.camera') }}" data-path="{{ url_for('camera_bp.camera') }}">
                    <span class="icon">📹</span> دوربین
                </a>
            </li>


            <li>
                <a href="{{ url_for('radio_bp.radio') }}" data-path="{{ url_for('radio_bp.radio') }}">
                    <span class="icon">📡</span> رادیو
                </a>
            </li>

            <li>
                <a href="{{ url_for('report_bp.report') }}" data-path="{{ url_for('report_bp.report') }}">
                    <span class="icon">📊</span> گزارش‌گیری
                </a>
            </li>

            <li>
                <a href="{{ url_for('document_bp.document') }}" data-path="{{ url_for('document_bp.document') }}">
                    <span class="icon">📄</span> مستندات
                </a>
            </li>

            {% if current_user.is_authenticated and current_user.is_admin %}
            <li>
                <a href="{{ url_for('settings_bp.settings') }}" data-path="{{ url_for('settings_bp.settings') }}">
                    <span class="icon">⚙️</span> تنظیمات
                </a>
            </li>
            {% endif %}

            <!-- خروج همیشه جدا و انتهای نوار -->
            <li class="ms-auto">
                <a href="{{ url_for('login_bp.logout') }}" onclick="return confirm('آیا میخواهید خارج شوید ؟');">
                    <span class="icon">🚪</span> خروج
                </a>
            </li>

        </ul>
    </div>


    <!-- محتوای اصلی -->
    <main>
        {% block content %}
        <h1>محتوا</h1>
        {% endblock %}
    </main>


    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #e3f2fd;
        }

        #topbar {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 60px;
            background-color: #0d6efd;
            color: white;
            z-index: 1050;

            display: flex;
            align-items: center;

            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
        }

        #topbar::-webkit-scrollbar {
            height: 6px;
        }

        #topbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        #topbar ul {
            list-style: none;
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 0 auto;
            /* ← کل منو وسط‌چین */
            padding: 0 10px;
        }

        #topbar ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 14px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            font-size: 15px;
            white-space: nowrap;
            transition: background 0.2s;
        }

        #topbar ul li a.active,
        #topbar ul li a:hover {
            background-color: rgba(255, 255, 255, 0.18);
        }

        .icon {
            margin-left: 6px;
            font-size: 1.2rem;
        }

        main {
            padding: 80px 20px;
        }
    </style>


    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const links = document.querySelectorAll('#topbar ul li a');

            const currentPath = window.location.pathname;
            links.forEach(link => {
                const path = link.getAttribute('data-path') || link.getAttribute('href');
                link.classList.toggle('active', path === currentPath);
            });
        });

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/static/service-worker.js");
        }
    </script>


</body>

</html>
