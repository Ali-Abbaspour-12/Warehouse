{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-lg border-primary p-4" style="width: 50%; min-width: 300px;">

        <!-- پیام‌های فلش -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="alert alert-info">
            <ul class="mb-0">
                {% for category, message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <h4 class="text-center mb-4 text-primary fw-bold">مدیریت ریکوردها</h4>

        <div class="text-center">
            <a href="{{ url_for('settings_bp.delete_all_records') }}" class="btn btn-danger fw-bold" onclick="return confirm('آیا مطمئن هستید که می‌خواهید این عمل را انجام دهید');">
                حذف همه ریکوردها
            </a>
        </div>

    </div>

</div>

{% endblock %}
