{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <h3 class="text-center text-primary mb-4">نمایش رکوردهای فایل اکسل</h3>

    <table class="table table-bordered table-striped">
        <thead class="table-primary">
            <tr>
                {% for key in records[0].keys() %}
                <th>{{ key }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in records %}
            <tr>
                {% for value in row.values() %}
                <td>{{ value }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <form action="{{ url_for('item_bp.import_to_database') }}" method="post" class="mt-3">
        <button class="btn btn-success w-100 fw-bold">
            وارد کردن تمامی رکوردها به پایگاه داده
        </button>
    </form>

</div>

{% endblock %}
