{% extends 'base.html' %}

{% block content %}
<div class="card shadow mt-4">
    <div class="card-header bg-primary text-white">
        <h4 class="m-0">افزودن تعمیر جدید</h4>
    </div>

    <div class="card-body">

        <form method="POST" class="row g-3" autocomplete="off">

            <div class="col-md-6">
                <label class="form-label">نوع دستگاه</label>
                <input name="device_type" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">مدل</label>
                <input name="model" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">سریال</label>
                <input name="serial_number" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">کد اموال</label>
                <input name="property_code" class="form-control">
            </div>

            <div class="col-12">
                <label class="form-label">توضیحات</label>
                <textarea name="description" class="form-control"></textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">وضعیت</label>
                <input name="status" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">محل فعلی</label>
                <input name="current_location" class="form-control">
            </div>

            <div class="col-12 text-end">
                <button class="btn btn-primary btn-lg w-100 fw-bold mt-3">ثبت اطلاعات</button>
            </div>
            <div class="col-12 text-end">
                <a href="{{url_for('item_bp.repair_item')}}"
                    class="btn btn-secondary btn-lg w-100 fw-bold mt-1">بازگشت</a>
            </div>

        </form>

    </div>
</div>


{% endblock %}
