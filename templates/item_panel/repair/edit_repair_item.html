{% extends 'base.html' %}

{% block content %}

<div class="card shadow mt-4">
    <div class="card-header bg-primary text-white">
        <h4 class="m-0">ویرایش تعمیر</h4>
    </div>

    <div class="card-body">

        <form method="POST" class="row g-3">

            <div class="col-md-6">
                <label class="form-label">نوع دستگاه</label>
                <input name="device_type" class="form-control" value="{{ repair.device_type }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">مدل</label>
                <input name="model" class="form-control" value="{{ repair.model }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">سریال</label>
                <input name="serial_number" class="form-control" value="{{ repair.serial_number }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">کد اموال</label>
                <input name="property_code" class="form-control" value="{{ repair.property_code }}">
            </div>

            <div class="col-12">
                <label class="form-label">توضیحات</label>
                <textarea name="description" class="form-control">{{ repair.description }}</textarea>
            </div>

            <div class="col-md-6">
                <label class="form-label">وضعیت</label>
                <input name="status" class="form-control" value="{{ repair.status }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">محل فعلی</label>
                <input name="current_location" class="form-control" value="{{ repair.current_location }}">
            </div>

            <div class="col-12 text-end">
                <button class="btn btn-primary btn-lg w-100 fw-bold mt-3">ذخیره تغییرات</button>
            </div>
            <div class="col-12 text-end">
                <a href="{{url_for('item_bp.repair_item')}}" class="btn btn-secondary btn-lg w-100 fw-bold mt-1">بازگشت</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
