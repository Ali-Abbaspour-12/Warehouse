{% extends 'base.html' %}
{% block content %}

<div class="container mt-5 d-flex justify-content-center">

    <div class="card shadow-lg border-primary p-4" style="width: 50%; min-width: 350px;">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="alert alert-info">
            <ul class="mb-0">
                {% for category, message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}
        {% endwith %}

        <h4 class="mb-4 text-primary fw-bold">مدیریت رکوردهای اکسل</h4>

        <form action="{{ url_for('item_bp.show_records') }}"
              method="post" enctype="multipart/form-data"
              class="d-grid gap-3">

            <input type="file" name="excel_file" accept=".xlsx,.xls" class="form-control">

            <button type="submit" class="btn btn-primary fw-bold">
                نمایش رکوردهای فایل اکسل
            </button>
        </form>

        <div class="text-center d-grid gap-3 mt-4">
            <a href="{{ url_for('item_bp.add_item') }}" class="btn btn-secondary fw-bold">
                بازگشت
            </a>
        </div>

    </div>

</div>

{% endblock %}
