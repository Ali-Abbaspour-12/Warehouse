{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="col-12 col-md-10 col-lg-8 mx-auto">
        <div class="card shadow-sm border-primary ">
            <div class="card-header bg-primary text-white fw-bold text-center">
                افزودن شماره تلفن
            </div>
            <div class="card-body">

                <form method="post" autocomplete="off ">

                    <div class="row g-3">
                        {% set fields = [
                        ('username','نام کاربری'),
                        ('project','پروژه'),
                        ('phone_number','شماره تلفن'),
                        ('pre_phone_number','پیش شماره'),
                        ] %}

                        {% for id,label in fields %}
                        <div class="col-md-4 position-relative">
                            <label class="form-label fw-bold">{{ label }}</label>
                            <input type="text" name="{{id}}" id="{{id}}" class="form-control border-primary"
                                onclick="loadSuggestions('{{id}}')" oninput="loadSuggestions('{{id}}')" required>
                            <div class="suggest-box" id="{{id}}_box"></div>
                        </div>
                        {% endfor %}
                    </div>
                    <br>
                    <div class="mt-2 d-flex">
                        <button class="btn btn-success flex-fill fw-bold m-1">افزودن شماره تلفن</button>

                        <a class="btn btn-secondary flex-fill fw-bold m-1"
                            href="{{ url_for('phone_bp.phone') }}">بازگشت</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- CSS -->
<style>
    .suggest-box {
        position: absolute;
        width: 100%;
        background: #fff;
        border: 1px solid #0d6efd;
        border-radius: 0.25rem;
        max-height: 200px;
        overflow-y: auto;
        display: none;
        z-index: 2000;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .suggest-item {
        padding: 6px 10px;
        cursor: pointer;
        font-size: 0.9rem;
    }

    .suggest-item:hover {
        background: #e3f2fd;
    }
</style>

<!-- JS -->
<script>
    async function loadSuggestions(fieldId) {
        const input = document.getElementById(fieldId);
        const box = document.getElementById(fieldId + '_box');
        const term = input.value.trim();

        const response = await fetch(`/phone/field_suggestions?field=${fieldId}&term=${term}`);
        const suggestions = await response.json();

        if (suggestions.length === 0) {
            box.style.display = 'none';
            box.innerHTML = '';
            return;
        }

        box.innerHTML = '';
        suggestions.forEach(val => {
            const div = document.createElement('div');
            div.textContent = val;
            div.classList.add('suggest-item');
            div.addEventListener('click', () => {
                input.value = val;
                box.style.display = 'none';
            });
            box.appendChild(div);
        });

        box.style.display = 'block';
    }

    // بستن لیست هنگام کلیک خارج از input
    document.addEventListener('click', function (e) {
        document.querySelectorAll('.suggest-box').forEach(box => {
            const input = document.getElementById(box.id.replace('_box', ''));
            if (!box.contains(e.target) && !input.contains(e.target)) {
                box.style.display = 'none';
            }
        });
    });
</script>

{% endblock %}
