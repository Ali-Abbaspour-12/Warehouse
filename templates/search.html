{% extends "base.html" %}


{% block content %}

    <a href="{{url_for('search_bp.show_all_records')}}">نمایش همه ریکورد ها</a>
    

    <form method="get" autocomplete="off" ><br>

        <label for="property_code">کد اموال</label>
        <input id="property_code" type="text" name="property_code">


        <label for="project_code">کد پروژه</label>
        <input type="text" list="project_code" name="project_code" id="project_code">
        <datalist name="project_code" id="project_code">
            <option value="362">
            <option value="290">
            <option value="392">
                
        </datalist>

        <label for="company">شرکت</label>
         <input type="text" list="company" name="company" id="company">
        <datalist name="company" id="company">
                
        </datalist>

        <label for="category">گروه بندی</label>
        <input type="text" list="category" name="category">
        <datalist name="category" id="category">
                
        </datalist>

        <label for="warehouse_location">محل</label>
        <input type="text" list="warehouse_location" name="warehouse_location" id="warehouse_location">
        <datalist name="warehouse_location" id="warehouse_location">
                
        </datalist>


        

        <button type="submit">جستجو</button><br>

    </form>

   
    {% if items|length == 0 %}
        <h1>موردی یافت نشد !</h1>

    {% else %}
        <table>
    <thead>
        <tr>
            <th>کد پروژه</th>
            <th>کد اموال</th>
            <th>کاربر</th>
        </tr>
    </thead>
    <tbody>
    {% for item in items %}
   
        <tr>
            <td>{{item.project_code}}</td>
           <td>{{item.property_code}}</td>
            <td>{{item.user}}</td>
            <td><a href="{{url_for('search_bp.item_detail',item_id=item.id,**request.args)}}">جزییات</a></td>
        </tr>
    
    {% endfor %}
    </tbody>
</table>
    {% endif %}
    




    
{% endblock %}
