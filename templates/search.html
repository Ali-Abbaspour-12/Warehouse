{% extends "base.html" %}


{% block content %}

    <a href="{{url_for('search_bp.show_all_records')}}">نمایش همه ریکورد ها</a>
    <form method="get" ><br>
        
        <input type="text" name="q">
        <button type="submit">جستجو</button>
        
    </form><br>

    <form method="get" >

        <input type="text" list="project_code">
        <datalist name="project_code" id="project_code">
            <option value="362">
            <option value="290">
            <option value="392">
                
        </datalist>

         <input type="text" list="company">
        <datalist name="company" id="company">
            <option value="362">
            <option value="290">
            <option value="392">
                
        </datalist>
        <button type="submit">فیلتر کردن</button><br>

    </form>

    <ul>
    {% for item in items %}
        <li>{{ item.property_code }} - {{ item.model }} - {{item.id}} - <a href="{{url_for('search_bp.item_detail',item_id=item.id)}}">جزییات</a></li>
    {% endfor %}
</ul>
    
{% endblock %}
