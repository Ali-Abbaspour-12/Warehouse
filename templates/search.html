{% extends "base.html" %}


{% block content %}

    <a href="{{url_for('search_bp.show_all_records')}}">نمایش همه ریکورد ها</a>
    <form method="get" >
        
        <input type="text" name="q"><br>
        <button type="submit">جستجو</button><br>
        
    </form><br>

    <ul>
    {% for item in items %}
        <li>{{ item.property_code }} - {{ item.model }} - {{item.id}} - <a href="{{url_for('search_bp.item_detail',item_id=item.id)}}">جزییات</a></li>
    {% endfor %}
</ul>
    
{% endblock %}
