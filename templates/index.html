<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>IT Warehouse</title>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <ul>
            <li><a href="/dashboard" class="tab-link">داشبورد</a></li>
            <li><a href="/search" class="tab-link">جستجو</a></li>
            <li><a href="/excel_import" class="tab-link">وارد کردن از اکسل</a></li>
            <li><a href="/settings" class="tab-link">تنظیمات</a></li>
        </ul>
    </div>

    <div class="content" id="content">
       <h1>welcome</h1>
    </div>
</div>

</body>

<style>
    body {
    font-family: sans-serif;
    margin: 0;
    direction: rtl;
    background-color: #f4f6f9;
}

.container {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 220px;
    background-color: #2c3e50;
    color: white;
    padding: 20px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 20px;
}

.sidebar ul {
    list-style: none;
    padding: 0;
}

.sidebar ul li {
    margin-bottom: 15px;
}

.sidebar a {
    color: white;
    text-decoration: none;
    display: block;
    padding: 8px 10px;
    border-radius: 4px;
    transition: background-color 0.3s;
}

.sidebar a:hover {
    background-color: #34495e;
}

.content {
    flex: 1;
    padding: 30px;
    background: white;
    overflow-y: auto;
    border-right: 1px solid #ddd;
}

.sidebar a.active {
    background-color: #1abc9c;
    font-weight: bold;
}

.sidebar a.active:hover {
    background-color: #16a085;
}

.sidebar {
  width: 60px;
  transition: width 0.3s ease;
  overflow: hidden;
}

.sidebar:hover {
  width: 220px;
}

.sidebar ul li a {
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.sidebar:hover ul li a {
  opacity: 1;
}
</style>

<script>

    document.addEventListener("DOMContentLoaded", () => {
  const links = document.querySelectorAll(".tab-link");
  const contentDiv = document.getElementById("content");

  links.forEach(link => {
    link.addEventListener("click", async (e) => {
      e.preventDefault();
      const url = e.target.getAttribute("href");

      // حذف حالت فعال از همه لینک‌ها
      links.forEach(l => l.classList.remove("active"));

      // اضافه کردن حالت فعال به تب انتخاب شده
      e.target.classList.add("active");

      // دریافت محتوای صفحه با AJAX
      const res = await fetch(url);
      const html = await res.text();
      contentDiv.innerHTML = html;
    });
  });
});

</script>

</html>
